services:
  companion:
    build: .
    ports:
      - "${PORT:-18000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FIXTURE_DIR: /app/fixtures/documents
      DATA_PATH: /data/store.json
    volumes:
      - companion-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  companion-data:
